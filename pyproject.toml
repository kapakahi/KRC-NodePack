[project]
name = "krc-nodepack"
description = "A unified ComfyUI node pack: a LoRA loadout/loader, a model library, prompt management, media loader/output nodes, Config Switcher nodes and a word bank. Optional nodes live in KRC NodePack Extras."
version = "1.0.2"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/kapakahi/KRC-NodePack"
Documentation = "https://github.com/kapakahi/KRC-NodePack#readme"
"Bug Tracker" = "https://github.com/kapakahi/KRC-NodePack/issues"

[tool.comfy]
PublisherId = "krc"
DisplayName = "KRC NodePack"
Icon = "https://raw.githubusercontent.com/kapakahi/KRC-NodePack/main/icon.svg"
